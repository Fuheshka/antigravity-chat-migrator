name: Build Windows Distribution

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run unit & regression tests
        run: |
          pytest -v

      - name: Build standalone executable and portable ZIP
        shell: pwsh
        run: |
          .\packaging\windows\build_windows.ps1 -Clean

      - name: Upload Windows x64 ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Chat-Migrator-Windows-x64
          path: dist/Antigravity-Chat-Migrator-Windows-x64.zip
          if-no-files-found: error
