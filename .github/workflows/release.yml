name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave empty to use ref)"
        required: false
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Distribution (DMG & CLI)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run unit & regression tests
        run: |
          pytest -v

      - name: Build macOS DMG and Standalone Executable
        run: |
          chmod +x packaging/macos/build_macos.sh
          # Build universal2 if supported by runner, fallback to native runner architecture
          ./packaging/macos/build_macos.sh --clean --arch universal2 || ./packaging/macos/build_macos.sh --clean
          cp dist/macos/agy-migrator dist/macos/agy-migrator-macos

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/macos/Antigravity-Chat-Migrator-macOS.dmg
            dist/macos/agy-migrator-macos
          if-no-files-found: error

  build-windows:
    name: Build Windows Distribution (Setup, ZIP & EXE)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run unit & regression tests
        run: |
          pytest -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build standalone executable, installer and portable ZIP
        shell: pwsh
        run: |
          .\packaging\windows\build_windows.ps1 -Clean

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/Antigravity-Chat-Migrator-Windows-x64-Setup.exe
            dist/Antigravity-Chat-Migrator-Windows-x64-Portable.zip
            dist/windows/agy-migrator.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release & Checksums
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare artifacts and generate SHA256 checksums
        run: |
          cd release-artifacts
          # Flatten all artifacts from subdirectories into root of release-artifacts
          find . -mindepth 2 -type f -exec mv -t . {} + 2>/dev/null || find . -mindepth 2 -type f -exec mv {} . \;
          find . -type d -empty -delete
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|^\./||' | sort -k 2 > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Prepare Release Notes
        env:
          TARGET_TAG_INPUT: ${{ inputs.tag }}
        run: |
          TARGET_TAG="${TARGET_TAG_INPUT}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ] || [ "$TARGET_TAG" = "dev" ]; then
            TARGET_TAG="v0.1.0"
          fi
          echo "TARGET_TAG=${TARGET_TAG}" >> $GITHUB_ENV

          cat <<EOF > release_notes.md
          ## Загрузки / Downloads

          ### 🪟 Windows (x64)
          - **Инсталлятор:** [Antigravity-Chat-Migrator-Windows-x64-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${TARGET_TAG}/Antigravity-Chat-Migrator-Windows-x64-Setup.exe) - автоматическая установка в профиль пользователя, меню Пуск, опциональное добавление в PATH.
          - **Портативная версия:** [Antigravity-Chat-Migrator-Windows-x64-Portable.zip](https://github.com/${{ github.repository }}/releases/download/${TARGET_TAG}/Antigravity-Chat-Migrator-Windows-x64-Portable.zip) - архив без установки (GUI-лаунчер, CLI и скрипт run_fix.bat).
          - **Консольная утилита:** [agy-migrator.exe](https://github.com/${{ github.repository }}/releases/download/${TARGET_TAG}/agy-migrator.exe) - автономный CLI бинарник.

          ### 🍏 macOS
          - **Образ диска (DMG):** [Antigravity-Chat-Migrator-macOS.dmg](https://github.com/${{ github.repository }}/releases/download/${TARGET_TAG}/Antigravity-Chat-Migrator-macOS.dmg) - нативное приложение (Drag & Drop в Applications).
          - **Консольная утилита:** [agy-migrator-macos](https://github.com/${{ github.repository }}/releases/download/${TARGET_TAG}/agy-migrator-macos) - автономный CLI бинарник.

          ### Контрольные суммы (SHA256)
          \`\`\`
          $(cat release-artifacts/SHA256SUMS.txt)
          \`\`\`
          EOF
          echo "Generated release_notes.md:"
          cat release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT_FLAG=""
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          echo "Target Release Tag: ${TARGET_TAG}"
          echo "Draft Flag: ${DRAFT_FLAG}"

          if gh release view "${TARGET_TAG}" &>/dev/null; then
            echo "Release ${TARGET_TAG} already exists. Uploading artifacts..."
            gh release upload "${TARGET_TAG}" release-artifacts/* --clobber
            gh release edit "${TARGET_TAG}" --notes-file release_notes.md
          else
            echo "Creating new release ${TARGET_TAG}..."
            gh release create "${TARGET_TAG}" \
              --title "Antigravity Chat Migrator ${TARGET_TAG}" \
              --notes-file release_notes.md \
              --generate-notes \
              ${DRAFT_FLAG} \
              release-artifacts/*
          fi

