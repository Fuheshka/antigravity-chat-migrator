[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-chat-migrator"
version = "0.1.0"
description = "Cross-platform CLI & utility to fix Outside of Project chats and synchronize Antigravity conversations across workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniil Kuviko (Fuheshka)" }
]
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "psutil>=5.9.0",
    "pywebview>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
agy-migrator = "antigravity_migrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

